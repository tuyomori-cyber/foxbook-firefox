// Loaded only when install-dev-addon.sh has explicitly installed this file.
// It reads only the root-managed development extension registry.

const { classes: foxbookDevCc, interfaces: foxbookDevCi } = Components;
const FOXBOOK_DEV_REGISTRY_PATH = "/etc/foxbook/dev-addons.tsv";
const FOXBOOK_DEV_RELOAD_WIDGET_ID = "foxbook-dev-addon-reload";
const FOXBOOK_DEV_RELOAD_WIDGET_INTRODUCED_PREF =
  "foxbook.devAddon.reloadWidgetIntroduced";
let foxbookDevLoadStarted = false;
let foxbookDevAddonManagerPromise = null;

function foxbookDevLog(message) {
  foxbookDevCc["@mozilla.org/consoleservice;1"]
    .getService(foxbookDevCi.nsIConsoleService)
    .logStringMessage(`[Foxbook dev addon] ${message}`);
}

function foxbookDevFile(path) {
  const file = foxbookDevCc["@mozilla.org/file/local;1"]
    .createInstance(foxbookDevCi.nsIFile);
  file.initWithPath(path);
  return file;
}

function foxbookDevIsFile(file) {
  try {
    return file.exists() && file.isSymlink() === false && file.isFile() &&
      (file.permissions & 0o022) === 0;
  } catch (error) {
    foxbookDevLog(`Skipped unsafe file ${file.path}: ${error}`);
    return false;
  }
}

function foxbookDevReadText(file) {
  const input = foxbookDevCc["@mozilla.org/network/file-input-stream;1"]
    .createInstance(foxbookDevCi.nsIFileInputStream);
  const converter = foxbookDevCc["@mozilla.org/intl/converter-input-stream;1"]
    .createInstance(foxbookDevCi.nsIConverterInputStream);
  let text = "";
  const data = {};
  try {
    input.init(file, 0x01, 0o444, 0);
    converter.init(input, "UTF-8", 0, 0);
    while (converter.readString(-1, data) !== 0) text += data.value;
    return text;
  } finally {
    converter.close();
  }
}

function foxbookDevReadRegistry() {
  const registry = foxbookDevFile(FOXBOOK_DEV_REGISTRY_PATH);
  if (!foxbookDevIsFile(registry)) {
    foxbookDevLog(`Skipped: unsafe or missing registry: ${registry.path}`);
    return [];
  }
  try {
    const entries = new Map();
    for (const line of foxbookDevReadText(registry).split(/\r?\n/u)) {
      const [id, sourcePath, ...extra] = line.split("\t");
      if (extra.length !== 0 || !/^[A-Za-z0-9._@{}-]+$/u.test(id) ||
          !sourcePath || sourcePath.includes("\t")) continue;
      entries.set(id, sourcePath);
    }
    return [...entries].map(([id, sourcePath]) => ({ id, sourcePath }));
  } catch (error) {
    foxbookDevLog(`Skipped: could not read registry: ${error}`);
    return [];
  }
}

function foxbookDevManifestId(addonDirectory) {
  const manifest = addonDirectory.clone();
  manifest.append("manifest.json");
  try {
    if (!manifest.exists() || !manifest.isFile()) return null;
    const parsed = JSON.parse(foxbookDevReadText(manifest));
    return parsed.browser_specific_settings?.gecko?.id ??
      parsed.applications?.gecko?.id ?? null;
  } catch (error) {
    foxbookDevLog(`Skipped invalid manifest in ${addonDirectory.path}: ${error}`);
    return null;
  }
}

async function foxbookDevAddonManager() {
  if (!foxbookDevAddonManagerPromise) {
    foxbookDevAddonManagerPromise = (async () => {
      const { AddonManager } = ChromeUtils.importESModule(
        "resource://gre/modules/AddonManager.sys.mjs"
      );
      await AddonManager.readyPromise;
      return AddonManager;
    })();
  }
  return foxbookDevAddonManagerPromise;
}

function foxbookDevSourceDirectory(entry) {
  const directory = foxbookDevFile(entry.sourcePath);
  try {
    if (!directory.exists() || !directory.isDirectory() ||
        foxbookDevManifestId(directory) !== entry.id) {
      foxbookDevLog(`Skipped invalid source for ${entry.id}: ${entry.sourcePath}`);
      return null;
    }
    return directory;
  } catch (error) {
    foxbookDevLog(`Skipped source for ${entry.id}: ${error}`);
    return null;
  }
}

async function foxbookDevLoadTemporaryAddons() {
  let AddonManager;
  try {
    AddonManager = await foxbookDevAddonManager();
  } catch (error) {
    foxbookDevLog(`Skipped: AddonManager is unavailable: ${error}`);
    return;
  }
  for (const entry of foxbookDevReadRegistry()) {
    const directory = foxbookDevSourceDirectory(entry);
    if (!directory) continue;
    try {
      const addon = await AddonManager.installTemporaryAddon(directory);
      if (addon.id !== entry.id) {
        await addon.uninstall();
        foxbookDevLog(`Rejected loaded extension with unexpected ID: ${addon.id}.`);
        continue;
      }
      foxbookDevLog(`Loaded temporary extension: ${entry.id}.`);
    } catch (error) {
      foxbookDevLog(`Failed to load ${entry.id}: ${error}`);
    }
  }
}

async function foxbookDevReloadTemporaryAddons() {
  let AddonManager;
  try {
    AddonManager = await foxbookDevAddonManager();
  } catch (error) {
    foxbookDevLog(`Reload skipped: AddonManager is unavailable: ${error}`);
    return;
  }
  for (const entry of foxbookDevReadRegistry()) {
    if (!foxbookDevSourceDirectory(entry)) continue;
    try {
      const addon = await AddonManager.getAddonByID(entry.id);
      if (!addon?.temporarilyInstalled) {
        foxbookDevLog(`Reload skipped; ${entry.id} is not a temporary extension.`);
        continue;
      }
      await addon.reload();
      foxbookDevLog(`Reloaded temporary extension: ${entry.id}.`);
    } catch (error) {
      foxbookDevLog(`Failed to reload ${entry.id}: ${error}`);
    }
  }
}

function foxbookDevBuildReloadWidget(document) {
  const button = document.createXULElement("toolbarbutton");
  button.id = FOXBOOK_DEV_RELOAD_WIDGET_ID;
  button.setAttribute("class", "toolbarbutton-1 chromeclass-toolbar-additional");
  button.setAttribute("label", "開発拡張を再読み込み");
  button.setAttribute("tooltiptext", "登録済みの開発用一時拡張を再読み込みします");
  button.style.setProperty("list-style-image", 'url("chrome://global/skin/icons/reload.svg")');
  button.style.setProperty("-moz-context-properties", "fill");
  button.style.setProperty("fill", "currentColor");
  button.addEventListener("command", () => foxbookDevReloadTemporaryAddons());
  return button;
}

function foxbookDevInstallReloadWidget(browserWindow) {
  try {
    const CustomizableUI = browserWindow.CustomizableUI;
    if (!CustomizableUI) throw new Error("CustomizableUI is unavailable");
    // getWidget can return a XUL wrapper for an ID that has no actual widget.
    // Only an API-provided widget proves that our custom widget is registered.
    if (CustomizableUI.getWidget(FOXBOOK_DEV_RELOAD_WIDGET_ID)?.provider !==
        CustomizableUI.PROVIDER_API) {
      CustomizableUI.createWidget({
        id: FOXBOOK_DEV_RELOAD_WIDGET_ID,
        type: "custom",
        defaultArea: CustomizableUI.AREA_NAVBAR,
        label: "開発拡張を再読み込み",
        tooltiptext: "登録済みの開発用一時拡張を再読み込みします",
        onBuild(document) {
          return foxbookDevBuildReloadWidget(document);
        },
      });
    }
    const prefs = foxbookDevCc["@mozilla.org/preferences-service;1"]
      .getService(foxbookDevCi.nsIPrefService);
    const introduced = prefs.getBoolPref(
      FOXBOOK_DEV_RELOAD_WIDGET_INTRODUCED_PREF, false
    );
    if (!introduced) {
      // A previous failed registration can leave a placement with no node.
      if (CustomizableUI.getPlacementOfWidget(FOXBOOK_DEV_RELOAD_WIDGET_ID)) {
        CustomizableUI.removeWidgetFromArea(FOXBOOK_DEV_RELOAD_WIDGET_ID);
      }
      CustomizableUI.addWidgetToArea(
        FOXBOOK_DEV_RELOAD_WIDGET_ID,
        CustomizableUI.AREA_NAVBAR
      );
    }
    const placement = CustomizableUI.getPlacementOfWidget(
      FOXBOOK_DEV_RELOAD_WIDGET_ID
    );
    const target = browserWindow.document.getElementById(
      "nav-bar-customization-target"
    );
    let node = browserWindow.document.getElementById(FOXBOOK_DEV_RELOAD_WIDGET_ID);
    // AutoConfig registers after toolbar restoration. Repair the initial
    // nav-bar instance without re-adding a widget the user later removed.
    if (!node && target && placement?.area === CustomizableUI.AREA_NAVBAR) {
      node = foxbookDevBuildReloadWidget(browserWindow.document);
      target.append(node);
    }
    if (!introduced || (placement?.area === CustomizableUI.AREA_NAVBAR && !node)) {
      prefs.setBoolPref(FOXBOOK_DEV_RELOAD_WIDGET_INTRODUCED_PREF, Boolean(node));
      prefs.savePrefFile(null);
    }
  } catch (error) {
    foxbookDevLog(`Reload widget installation skipped: ${error}`);
  }
}

foxbookDevCc["@mozilla.org/observer-service;1"]
  .getService(foxbookDevCi.nsIObserverService)
  .addObserver((subject, topic) => {
    if (topic !== "browser-delayed-startup-finished") return;
    foxbookDevInstallReloadWidget(subject);
    if (foxbookDevLoadStarted) return;
    foxbookDevLoadStarted = true;
    foxbookDevLoadTemporaryAddons();
  }, "browser-delayed-startup-finished");
