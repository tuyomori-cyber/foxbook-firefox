// This first line is required by Firefox AutoConfig.
//
// The Firefox preference has room for only one AutoConfig entry point. Keep
// this bootstrap deliberately small so the normal Split View feature and the
// opt-in development feature remain separate scripts.

function foxbookLoadAutoConfigScript(fileName, optional) {
  const directoryService = Components.classes[
    "@mozilla.org/file/directory_service;1"
  ].getService(Components.interfaces.nsIProperties);
  const scriptLoader = Components.classes[
    "@mozilla.org/moz/jssubscript-loader;1"
  ].getService(Components.interfaces.mozIJSSubScriptLoader);
  const ioService = Components.classes[
    "@mozilla.org/network/io-service;1"
  ].getService(Components.interfaces.nsIIOService);
  const file = directoryService.get("GreD", Components.interfaces.nsIFile);
  file.append(fileName);

  if (!file.exists()) {
    if (!optional) {
      Components.classes["@mozilla.org/consoleservice;1"]
        .getService(Components.interfaces.nsIConsoleService)
        .logStringMessage(`[Foxbook AutoConfig] Missing required script: ${file.path}`);
    }
    return;
  }

  scriptLoader.loadSubScript(ioService.newFileURI(file).spec, this, "UTF-8");
}

foxbookLoadAutoConfigScript("foxbook-splitview.cfg", false);
foxbookLoadAutoConfigScript("foxbook-dev-temp-addon.cfg", true);
