// This first line is required by Firefox AutoConfig.
//
// Split View saved-ratio auto-apply for the dedicated Firefox.
// It accepts no input from web pages, extensions, or native messaging.

// AutoConfig's global does not provide browser-window modules on Firefox 158.
// Obtain only the three required XPCOM services directly.
const { classes: Cc, interfaces: Ci } = Components;
const Services = {
  prefs: Cc["@mozilla.org/preferences-service;1"].getService(Ci.nsIPrefService),
  obs: Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService),
  console: Cc["@mozilla.org/consoleservice;1"].getService(Ci.nsIConsoleService),
  scriptSecurityManager: Cc["@mozilla.org/scriptsecuritymanager;1"].getService(
    Ci.nsIScriptSecurityManager
  ),
};

const FOXBOOK_SPLITVIEW_RATIO_PREF = "foxbook.splitview.savedRatio";
const FOXBOOK_SPLITVIEW_PROBE_MARKER = "foxbook-splitview-probe-installed";
const FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID = "foxbook-splitview-ratio";
const FOXBOOK_SPLITVIEW_WIDGET_INTRODUCED_PREF =
  "foxbook.splitview.toolbarWidgetIntroduced";
const FOXBOOK_SPLITVIEW_MIN_PERCENT = 30;
const FOXBOOK_SPLITVIEW_MAX_PERCENT = 60;
const FOXBOOK_SPLITVIEW_STEP_PERCENT = 5;
let foxbookCustomizableUI = null;
let foxbookRatioWidgetInstallationError = null;
let foxbookRatioWidgetBuilt = false;

function foxbookSplitViewLog(message) {
  Services.console.logStringMessage(`[Foxbook Split View probe] ${message}`);
}

function foxbookReadSavedSplitViewRatio() {
  try {
    const ratio = Number(Services.prefs.getStringPref(FOXBOOK_SPLITVIEW_RATIO_PREF));
    return Number.isFinite(ratio) && ratio > 0 && ratio < 1 ? ratio : null;
  } catch (error) {
    return null;
  }
}

function foxbookApplySplitViewRatio(browserWindow, ratio) {
  try {
    if (!Number.isFinite(ratio) || ratio <= 0 || ratio >= 1) {
      return false;
    }
    const tabPanels = browserWindow.gBrowser?.tabpanels;
    const leftPanelId = tabPanels?.splitViewPanels?.[0];
    if (!tabPanels || !leftPanelId) {
      return false;
    }

    const leftPanel = browserWindow.document.getElementById(leftPanelId);
    if (!leftPanel) {
      foxbookSplitViewLog("Skipped: Split View left panel is unavailable.");
      return false;
    }
    const containerWidth = tabPanels.clientWidth;
    const minimumWidth = Number.parseFloat(
      browserWindow.getComputedStyle(leftPanel).minWidth
    );
    if (!Number.isFinite(containerWidth) || containerWidth <= 0 ||
        !Number.isFinite(minimumWidth)) {
      foxbookSplitViewLog("Skipped: Split View panel geometry is unavailable.");
      return false;
    }

    const width = Math.round(Math.max(
      minimumWidth,
      Math.min(containerWidth - minimumWidth, containerWidth * ratio)
    ));
    leftPanel.setAttribute("width", String(width));
    leftPanel.style.width = `${width}px`;
    browserWindow.gBrowser.activeSplitView?.resetRightPanelWidth();
    foxbookSplitViewLog(`Applied ${width}px (${ratio * 100}%).`);
    return true;
  } catch (error) {
    foxbookSplitViewLog(`Skipped after internal API error: ${error}`);
    return false;
  }
}

function foxbookApplySavedSplitViewRatio(browserWindow) {
  return foxbookApplySplitViewRatio(browserWindow, foxbookReadSavedSplitViewRatio());
}

function foxbookRatioToPercent(ratio) {
  const defaultPercent = 50;
  if (!Number.isFinite(ratio)) {
    return defaultPercent;
  }
  return Math.min(
    FOXBOOK_SPLITVIEW_MAX_PERCENT,
    Math.max(FOXBOOK_SPLITVIEW_MIN_PERCENT, Math.round(ratio * 100))
  );
}

function foxbookUpdateRatioWidgetLabel(label, percent) {
  label.value = `分割 ${percent}:${100 - percent}`;
}

function foxbookSaveSplitViewRatio(browserWindow, percent) {
  const ratio = percent / 100;
  try {
    Services.prefs.setStringPref(FOXBOOK_SPLITVIEW_RATIO_PREF, ratio.toFixed(2));
    Services.prefs.savePrefFile(null);
    foxbookApplySplitViewRatio(browserWindow, ratio);
    foxbookSplitViewLog(`Saved ${percent}:${100 - percent}.`);
  } catch (error) {
    foxbookSplitViewLog(`Saving skipped: ${error}`);
  }
}

function foxbookInstallRatioWidget(browserWindow) {
  try {
    const CustomizableUI = browserWindow.CustomizableUI;
    if (!CustomizableUI) {
      throw new Error("CustomizableUI is unavailable in the browser window");
    }
    foxbookCustomizableUI = CustomizableUI;
    if (!CustomizableUI.getWidget(FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID)) {
      CustomizableUI.createWidget({
      id: FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID,
      type: "custom",
      defaultArea: CustomizableUI.AREA_NAVBAR,
      label: "分割比率",
      tooltiptext: "Split View の左側の幅を変更して保存します",
      onBuild(document) {
        try {
          const browserWindow = document.defaultView;
          const item = document.createXULElement("toolbaritem");
          item.id = FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID;
          item.setAttribute("class", "chromeclass-toolbar-additional");
          item.setAttribute("align", "center");
          item.setAttribute("tooltiptext", "Split View の左側の幅を変更して保存します");

          const label = document.createXULElement("label");
          label.setAttribute("class", "toolbarbutton-text");
          const range = document.createElementNS(
            "http://www.w3.org/1999/xhtml", "input"
          );
          range.type = "range";
          range.min = String(FOXBOOK_SPLITVIEW_MIN_PERCENT);
          range.max = String(FOXBOOK_SPLITVIEW_MAX_PERCENT);
          range.step = String(FOXBOOK_SPLITVIEW_STEP_PERCENT);
          range.value = String(foxbookRatioToPercent(foxbookReadSavedSplitViewRatio()));
          range.setAttribute("aria-label", "Split View の左側の比率");
          range.style.width = "8em";
          foxbookUpdateRatioWidgetLabel(label, Number(range.value));

          range.addEventListener("input", () => {
            const percent = Number(range.value);
            foxbookUpdateRatioWidgetLabel(label, percent);
            foxbookApplySplitViewRatio(browserWindow, percent / 100);
          });
          range.addEventListener("change", () => {
            foxbookSaveSplitViewRatio(browserWindow, Number(range.value));
          });
          item.append(label, range);
          foxbookRatioWidgetBuilt = true;
          return item;
        } catch (error) {
          foxbookRatioWidgetInstallationError = `widget build failed: ${error}`;
          throw error;
        }
      },
      });
    }
    // AutoConfig registers after browser startup. Place the widget once for
    // existing profiles, then keep the user's later customization untouched.
    if (!Services.prefs.getBoolPref(FOXBOOK_SPLITVIEW_WIDGET_INTRODUCED_PREF, false)) {
      if (CustomizableUI.getPlacementOfWidget(FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID)) {
        CustomizableUI.removeWidgetFromArea(FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID);
      }
      CustomizableUI.addWidgetToArea(
        FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID,
        CustomizableUI.AREA_NAVBAR
      );
      const target = browserWindow.document.getElementById(
        "nav-bar-customization-target"
      );
      const node = CustomizableUI.getWidget(FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID)
        .forWindow(browserWindow).node;
      if (target && node && !node.isConnected) {
        target.append(node);
      }
      // Firefox does not build newly registered custom widgets for a window
      // that has already restored its toolbar. Build this first instance here.
      if (target && !browserWindow.document.getElementById(FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID)) {
        const item = browserWindow.document.createXULElement("toolbaritem");
        item.id = FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID;
        item.setAttribute("class", "chromeclass-toolbar-additional");
        const label = browserWindow.document.createXULElement("label");
        const range = browserWindow.document.createElementNS(
          "http://www.w3.org/1999/xhtml", "input"
        );
        range.type = "range";
        range.min = String(FOXBOOK_SPLITVIEW_MIN_PERCENT);
        range.max = String(FOXBOOK_SPLITVIEW_MAX_PERCENT);
        range.step = String(FOXBOOK_SPLITVIEW_STEP_PERCENT);
        range.value = String(foxbookRatioToPercent(foxbookReadSavedSplitViewRatio()));
        range.style.width = "8em";
        foxbookUpdateRatioWidgetLabel(label, Number(range.value));
        range.addEventListener("input", () => {
          const percent = Number(range.value);
          foxbookUpdateRatioWidgetLabel(label, percent);
          foxbookApplySplitViewRatio(browserWindow, percent / 100);
        });
        range.addEventListener("change", () => {
          foxbookSaveSplitViewRatio(browserWindow, Number(range.value));
        });
        item.append(label, range);
        target.append(item);
      }
      Services.prefs.setBoolPref(FOXBOOK_SPLITVIEW_WIDGET_INTRODUCED_PREF, true);
      Services.prefs.savePrefFile(null);
    }
    foxbookSplitViewLog("Ratio slider widget installed.");
  } catch (error) {
    foxbookRatioWidgetInstallationError = String(error);
    foxbookSplitViewLog(`Ratio slider widget installation skipped: ${error}`);
  }
}

function foxbookInstallSplitViewProbe(browserWindow) {
  try {
    if (browserWindow[FOXBOOK_SPLITVIEW_PROBE_MARKER]) {
      return;
    }
    browserWindow[FOXBOOK_SPLITVIEW_PROBE_MARKER] = true;

    const tabPanels = browserWindow.gBrowser?.tabpanels;
    if (!tabPanels) {
      foxbookSplitViewLog("Skipped: tab panels are unavailable.");
      return;
    }

    const scheduleApply = () => browserWindow.setTimeout(
      () => foxbookApplySavedSplitViewRatio(browserWindow), 0
    );
    browserWindow.gBrowser.tabContainer.addEventListener(
      "SplitViewCreated",
      scheduleApply
    );
    foxbookSplitViewLog("Installed. Saved ratios will apply to new Split Views.");
    foxbookRunSplitViewSelfTest(browserWindow);
  } catch (error) {
    foxbookSplitViewLog(`Installation skipped: ${error}`);
  }
}

function foxbookRecordSelfTest(result) {
  Services.prefs.setStringPref("foxbook.splitview.probe.result", result);
  Services.prefs.savePrefFile(null);
  foxbookSplitViewLog(`Self-test: ${result}`);
}

function foxbookRunSplitViewSelfTest(browserWindow) {
  if (!Services.prefs.getBoolPref("foxbook.splitview.probe.selftest", false)) {
    return;
  }

  browserWindow.setTimeout(() => {
    let firstTab;
    let secondTab;
    let splitView;
    try {
      if (!foxbookCustomizableUI?.getWidget(FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID)) {
        foxbookRecordSelfTest(
          `failed: ratio widget unavailable: ${foxbookRatioWidgetInstallationError}`
        );
        return;
      }
      if (!browserWindow.document.getElementById(FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID)) {
        const placement = foxbookCustomizableUI.getPlacementOfWidget(
          FOXBOOK_SPLITVIEW_RATIO_WIDGET_ID
        );
        const introduced = Services.prefs.getBoolPref(
          FOXBOOK_SPLITVIEW_WIDGET_INTRODUCED_PREF, false
        );
        foxbookRecordSelfTest(
          `failed: ratio widget was not built: ${foxbookRatioWidgetInstallationError}; ` +
          `placement=${JSON.stringify(placement)}; introduced=${introduced}; ` +
          `onBuild=${foxbookRatioWidgetBuilt}`
        );
        return;
      }
      const options = {
        triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal(),
      };
      firstTab = browserWindow.gBrowser.addTab("about:blank", options);
      secondTab = browserWindow.gBrowser.addTab("about:blank", options);
      splitView = browserWindow.gBrowser.addTabSplitView([firstTab, secondTab], {
        insertBefore: firstTab,
      });
      browserWindow.gBrowser.selectedTab = firstTab;
      browserWindow.gBrowser.showSplitViewPanels(splitView.tabs);
      browserWindow.setTimeout(() => {
        try {
          if (!foxbookReadSavedSplitViewRatio()) {
            foxbookRecordSelfTest("failed: saved ratio unavailable");
            return;
          }
          const panels = browserWindow.gBrowser.tabpanels;
          const left = browserWindow.document.getElementById(panels.splitViewPanels[0]);
          if (!left) {
            foxbookRecordSelfTest("failed: left panel unavailable");
            return;
          }
          const actual = left.getBoundingClientRect().width / panels.clientWidth;
          if (!Number.isFinite(actual)) {
            foxbookRecordSelfTest("failed: invalid measured ratio");
            return;
          }
          if (Math.abs(actual - foxbookReadSavedSplitViewRatio()) > 0.02) {
            foxbookRecordSelfTest("failed: apply returned false");
            return;
          }
          foxbookRecordSelfTest(
            `passed: ${actual.toFixed(3)}`
          );
        } catch (error) {
          foxbookRecordSelfTest(`failed: ${error}`);
        } finally {
          try {
            splitView?.close();
            if (firstTab) browserWindow.gBrowser.removeTab(firstTab);
            if (secondTab) browserWindow.gBrowser.removeTab(secondTab);
          } catch (error) {
            foxbookSplitViewLog(`Self-test cleanup skipped: ${error}`);
          }
        }
      }, 250);
    } catch (error) {
      foxbookRecordSelfTest(`failed: ${error}`);
    }
  }, 500);
}

Services.obs.addObserver((subject, topic) => {
  if (topic !== "browser-delayed-startup-finished") {
    return;
  }
  try {
    foxbookInstallSplitViewProbe(subject);
    foxbookInstallRatioWidget(subject);
  } catch (error) {
    foxbookSplitViewLog(`Observer skipped: ${error}`);
  }
}, "browser-delayed-startup-finished");
